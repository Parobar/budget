<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Семейный бюджет</title>
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, sticky month header, bottom tab bar; sheets slide up for forms. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16231F; --muted:#64726C; --line:#DCE2DD;
  --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --neg:#B0402E; --pos:#1F7A4A; --warn:#B7791F; --shade:rgba(10,20,16,.45);
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#18221F; --ink:#E7EEEA; --muted:#94A39C; --line:#2A3833;
  --accent:#4CC2A1; --accent-ink:#08201A; --accent-soft:#1D3A32;
  --neg:#EE8B79; --pos:#6CCB93; --warn:#E0B25C; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18221F; --ink:#E7EEEA; --muted:#94A39C; --line:#2A3833;
  --accent:#4CC2A1; --accent-ink:#08201A; --accent-soft:#1D3A32;
  --neg:#EE8B79; --pos:#6CCB93; --warn:#E0B25C; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--neg)} .pos{color:var(--pos)} .muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font:600 13px var(--f-display);letter-spacing:.02em}
.month{display:flex;align-items:center;gap:2px}
.month b{min-width:130px;text-align:center;font-weight:600;text-transform:capitalize}
.icon{border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--ink)}
.icon:hover{background:var(--line)}

h2{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}

.hero{display:grid;gap:14px}
.hero .big{font:600 clamp(26px,8vw,34px)/1.1 var(--f-display);letter-spacing:-.02em}
.hero .lab{font-size:13px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio>div{min-width:0}
.trio .v{font-weight:600;font-size:16px}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;text-align:right}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-body)}
.dot.e{background:color-mix(in srgb,var(--neg) 14%,var(--surface));color:var(--neg)}
.dot.t{background:var(--line);color:var(--muted)}
.dayh{font-size:13px;color:var(--muted);margin:16px 0 4px;font-weight:600}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--neg)} .bar.warn i{background:var(--warn)}
.cat{padding:9px 0;border-top:1px solid var(--line)} .cat:first-child{border-top:0}
.cat .h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}

.months{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.months>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.months .cols{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.months .cols i{width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.months .in{background:var(--accent)} .months .out{background:var(--neg);opacity:.85}
.months small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--accent)}
.legend span.o::before{background:var(--neg)}

.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;width:100%;max-width:560px;gap:2px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;
  border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

#shade{position:fixed;inset:0;background:var(--shade);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;max-height:92%}
#sheet .panel{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;overflow-y:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-width:0}
.fld .amount{font:600 28px var(--f-display);padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:500;max-width:90%}
.lim{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lim:first-child{border-top:0}
.lim input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;text-align:right;width:100%}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){#sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
[hidden]{display:none!important}
html{background:var(--bg)}
h1{text-wrap:balance}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">СЕМЕЙНЫЙ БЮДЖЕТ</span>
    <div class="month" id="monthnav">
      <button class="icon" data-act="prev" aria-label="Предыдущий месяц">‹</button>
      <b id="monthlabel"></b>
      <button class="icon" data-act="next" aria-label="Следующий месяц">›</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<button class="fab" id="fab" data-act="add-tx">+ Операция</button>
<nav class="tabs"><div class="in" id="tabs">
  <button data-tab="home">Обзор</button>
  <button data-tab="tx">Операции</button>
  <button data-tab="acc">Счета</button>
  <button data-tab="bud">Бюджет</button>
</div></nav>
<div id="overlay"></div>
<div id="toast" hidden></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const TYPES={
  cash:{label:"Наличные",debt:false,group:"Деньги"},
  debit:{label:"Карта или счёт",debt:false,group:"Деньги"},
  savings:{label:"Накопления",debt:false,group:"Накопления"},
  credit:{label:"Кредитная карта",debt:true,group:"Долги"},
  loan:{label:"Кредит или ипотека",debt:true,group:"Долги"}
};
const CATS={
  expense:["Продукты","Дом и ЖКХ","Транспорт","Авто","Кафе и рестораны","Здоровье","Дети","Одежда","Развлечения","Связь и подписки","Путешествия","Подарки","Прочее"],
  income:["Зарплата","Подработка","Подарки","Проценты","Возврат","Прочее"]
};
const CUR=["₽","$","€","₴","₸","Br","zł","£"];

const S={accounts:[],tx:[],settings:{currency:"₽",limits:{}},month:ym(new Date()),tab:"home",names:{},uid:null,readOnly:false,ready:{a:false,t:false},err:null,stage:"boot",authMode:"login",session:null,members:[],invite:"",loaded:false};
let draft=null,lastAcc=null,hh=null;

function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);return ym(new Date(y,mo-1+n,1))}
function monthName(m,short){const [y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("ru-RU",short?{month:"short"}:{month:"long",year:"numeric"})}
const nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const money=v=>nf.format(Math.round(v*100)/100)+" "+S.settings.currency;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function dayLabel(d){
  if(d===today())return "Сегодня";
  const y=new Date();y.setDate(y.getDate()-1);
  if(d===ym(y)+"-"+String(y.getDate()).padStart(2,"0"))return "Вчера";
  const [Y,M,D]=d.split("-").map(Number);
  return new Date(Y,M-1,D).toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"short"});
}

/* ---------- расчёты ---------- */
function balances(){
  const b={};
  S.accounts.forEach(a=>b[a.id]=a.initial||0);
  S.tx.forEach(t=>{
    if(t.kind==="income"){if(t.acc in b)b[t.acc]+=t.amount}
    else if(t.kind==="expense"){if(t.acc in b)b[t.acc]-=t.amount}
    else if(t.kind==="transfer"){if(t.acc in b)b[t.acc]-=t.amount;if(t.to in b)b[t.to]+=t.amount}
  });
  return b;
}
function monthStats(m){
  const r={income:0,expense:0,debtPaid:0,cats:{}};
  const debt=new Set(S.accounts.filter(a=>TYPES[a.type]?.debt).map(a=>a.id));
  S.tx.forEach(t=>{
    if(!t.date.startsWith(m))return;
    if(t.kind==="income")r.income+=t.amount;
    else if(t.kind==="expense"){r.expense+=t.amount;r.cats[t.cat]=(r.cats[t.cat]||0)+t.amount}
    else if(t.kind==="transfer"&&debt.has(t.to))r.debtPaid+=t.amount;
  });
  return r;
}
function worth(b){
  let assets=0,debts=0,savings=0;
  S.accounts.forEach(a=>{
    const v=b[a.id]||0;
    if(TYPES[a.type]?.debt)debts+=v;else{assets+=v;if(a.type==="savings")savings+=v}
  });
  return {assets,debts,savings,net:assets+debts};
}
const accName=id=>S.accounts.find(a=>a.id===id)?.name||"—";
const who=id=>S.names[id]||"";

/* ---------- отрисовка ---------- */
function render(){
  const inApp=S.stage==="app";
  document.querySelector("nav.tabs").hidden=!inApp;
  $("#monthnav").style.visibility=(inApp&&S.tab!=="acc")?"visible":"hidden";
  $("#fab").hidden=!inApp||S.readOnly||S.tab==="bud";
  $("#monthlabel").textContent=monthName(S.month);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab));
  const app=$("#app");
  if(S.stage==="boot"){app.innerHTML=`<div class="card empty">Загружаю…</div>`;return}
  if(S.stage==="auth"){app.innerHTML=vAuth();return}
  if(S.stage==="house"){app.innerHTML=vHouse();return}
  if(S.err){app.innerHTML=`<div class="card empty"><b>Не удалось загрузить данные</b>${esc(S.err)}<div style="margin-top:14px"><button class="btn" data-act="reload">Повторить</button></div></div>`;return}
  app.innerHTML=({home:vHome,tx:vTx,acc:vAcc,bud:vBud}[S.tab])();
}

function vAuth(){
  const reg=S.authMode==="reg";
  return `<form class="card" id="authform" style="margin-top:24px">
    <h1 style="font:600 22px var(--f-display);margin:0 0 4px">${reg?"Регистрация":"Вход"}</h1>
    <p class="note" style="margin:0 0 16px">Семейный бюджет</p>
    <div class="fld"><label for="au-email">Почта</label><input id="au-email" type="email" autocomplete="email" required></div>
    <div class="fld"><label for="au-pass">Пароль (не короче 6 символов)</label><input id="au-pass" type="password" minlength="6" autocomplete="${reg?"new-password":"current-password"}" required></div>
    <button class="btn block" type="submit">${reg?"Создать аккаунт":"Войти"}</button>
    <p style="text-align:center;margin:14px 0 0"><button class="link" type="button" data-act="auth-mode">${reg?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться"}</button></p></form>`;
}
function vHouse(){
  return `<div class="card" style="margin-top:24px">
    <h1 style="font:600 22px var(--f-display);margin:0 0 4px">Ваша семья</h1>
    <p class="note" style="margin:0 0 16px">Один из вас создаёт семью, второй вводит код приглашения.</p>
    <div class="fld"><label for="h-name">Ваше имя</label><input id="h-name" type="text" maxlength="30" autocomplete="given-name"></div>
    <button class="btn block" data-act="h-create">Создать семью</button>
    <h2>или</h2>
    <div class="fld"><label for="h-code">Код приглашения</label><input id="h-code" type="text" autocapitalize="off" autocomplete="off"></div>
    <button class="btn ghost block" data-act="h-join">Присоединиться</button>
    <p style="text-align:center;margin:14px 0 0"><button class="link" data-act="logout">Выйти</button></p></div>`;
}

function vHome(){
  const b=balances(),w=worth(b),st=monthStats(S.month);
  if(!S.accounts.length)return `<div class="card empty"><b>Начните со счетов</b>Добавьте кошелёк, карту, накопления, кредитную карту или кредит. Остальное считается само.<div style="margin-top:14px"><button class="btn" data-act="add-acc">Добавить счёт</button></div></div>`;
  const left=st.income-st.expense;
  let h=`<section class="card hero">
    <div><div class="lab">Чистый капитал</div><div class="big num ${w.net<0?"neg":""}">${money(w.net)}</div></div>
    <div class="trio">
      <div><div class="lab">Деньги</div><div class="v num">${money(w.assets)}</div></div>
      <div><div class="lab">Накопления</div><div class="v num pos">${money(w.savings)}</div></div>
      <div><div class="lab">Долги</div><div class="v num neg">${money(Math.abs(w.debts))}</div></div>
    </div></section>`;
  h+=`<h2>${esc(monthName(S.month))}</h2><section class="card hero">
    <div class="trio">
      <div><div class="lab">Доходы</div><div class="v num pos">${money(st.income)}</div></div>
      <div><div class="lab">Расходы</div><div class="v num neg">${money(st.expense)}</div></div>
      <div><div class="lab">Осталось</div><div class="v num ${left<0?"neg":""}">${money(left)}</div></div>
    </div>
    ${st.debtPaid?`<div class="note">Отправлено на погашение долгов: <span class="num">${money(st.debtPaid)}</span></div>`:""}
    ${st.income>0?`<div class="note">Расходы составили ${Math.round(st.expense/st.income*100)}% дохода.</div>`:""}
  </section>`;
  const cats=Object.entries(st.cats).sort((a,b)=>b[1]-a[1]);
  h+=`<h2>Расходы по категориям</h2>`;
  if(!cats.length)h+=`<div class="card empty"><b>В этом месяце расходов нет</b>Нажмите «+ Операция», чтобы добавить первую.</div>`;
  else{
    const mx=Math.max(...cats.map(c=>c[1]),...Object.values(S.settings.limits||{}).map(Number).filter(Boolean));
    h+=`<div class="card">`+cats.map(([c,v])=>{
      const lim=Number(S.settings.limits?.[c])||0;
      const pct=Math.min(100,(lim?v/lim:v/mx)*100);
      const cls=lim&&v>lim?"over":(lim&&v>lim*.85?"warn":"");
      return `<div class="cat"><div class="h"><span>${esc(c)}</span><span class="num">${money(v)}${lim?` <span class="muted">из ${nf.format(lim)}</span>`:""}</span></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
    }).join("")+`</div>`;
  }
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(S.month,-i));
  const data=ms.map(m=>({m,...monthStats(m)}));
  const top=Math.max(1,...data.map(d=>Math.max(d.income,d.expense)));
  h+=`<h2>Последние 6 месяцев</h2><div class="card"><div class="months">`+data.map(d=>
    `<div><div class="cols"><i class="in" style="height:${d.income/top*100}%" title="Доходы ${money(d.income)}"></i><i class="out" style="height:${d.expense/top*100}%" title="Расходы ${money(d.expense)}"></i></div><small>${esc(monthName(d.m,true))}</small></div>`).join("")+
    `</div><div class="legend"><span>Доходы</span><span class="o">Расходы</span></div></div>`;
  return h;
}

function txRow(t){
  const sign=t.kind==="income"?"+":t.kind==="expense"?"−":"";
  const cls=t.kind==="income"?"pos":t.kind==="expense"?"neg":"";
  const dot=t.kind==="income"?"+":t.kind==="expense"?"−":"⇄";
  const title=t.kind==="transfer"?`${accName(t.acc)} → ${accName(t.to)}`:t.cat;

function monthsLeft(debt,rate,pay){
  const r=rate/1200;
  if(!pay||pay<=0)return null;
  if(!r)return Math.ceil(debt/pay);
  const x=1-r*debt/pay;
  if(x<=0)return null;
  return Math.ceil(-Math.log(x)/Math.log(1+r));
}
function accRow(a,b){
  const v=b[a.id]||0,T=TYPES[a.type]||TYPES.debit;
  let sub=T.label,extra="";
  if(a.type==="credit"){
    const debt=Math.max(0,-v);
    if(a.limit){
      const used=Math.min(100,debt/a.limit*100);
      sub+=` · доступно ${money(Math.max(0,a.limit-debt))}`;
      extra=`<div class="bar ${used>80?"over":used>50?"warn":""}" style="margin-top:6px"><i style="width:${used}%"></i></div>`;
    }
    if(a.rate)sub+=` · ${a.rate}%`;
  }
  if(a.type==="loan"){
    if(a.rate)sub+=` · ${a.rate}%`;
    if(a.payment)sub+=` · платёж ${money(a.payment)}`;
    const n=a.payment&&v<0?monthsLeft(-v,a.rate||0,a.payment):null;
    if(n)sub+=` · ещё ~${n} мес.`;
  }
  return `<button class="row" data-act="edit-acc" data-id="${esc(a.id)}"><span class="dot ${T.debt?"e":""}">${esc(a.name.slice(0,1).toUpperCase())}</span>
    <span class="main"><div class="t">${esc(a.name)}</div><div class="s">${esc(sub)}</div>${extra}</span>
    <span class="amt num ${v<0?"neg":""}">${money(v)}</span></button>`;
}

function syncDraft(){

  const g=id=>document.getElementById(id);
  if(draft.type==="tx"){
    if(g("f-amount"))draft.amount=g("f-amount").value;
    if(g("f-date"))draft.date=g("f-date").value;
    if(g("f-cat"))draft.cat=g("f-cat").value;
    if(g("f-acc"))draft.acc=g("f-acc").value;
    if(g("f-to"))draft.to=g("f-to").value;
    if(g("f-note"))draft.note=g("f-note").value;
  }else{
    ["name","kind","amount","limit","rate","payment"].forEach(k=>{if(g("a-"+k))draft[k]=g("a-"+k).value});
  }
}

         :{type:"tx",id:null,kind:kind||"expense",amount:"",date:today(),cat:"",acc:S.accounts.some(a=>a.id===lastAcc)?lastAcc:S.accounts[0].id,to:"",note:"",confirm:false};

async function saveTx(){
  syncDraft();const d=draft;
  const amount=parseFloat(String(d.amount).replace(",","."));
  if(!(amount>0))return toast("Введите сумму больше нуля");
  if(!d.date)return toast("Укажите дату");
  if(d.kind==="transfer"&&(!d.to||d.to===d.acc))return toast("Выберите два разных счёта");
  const rec={kind:d.kind,amount:Math.round(amount*100)/100,date:d.date,acc:d.acc,note:d.note.trim(),by:d.by||S.uid||""};
  if(d.kind==="transfer")rec.to=d.to;else rec.cat=d.cat;
  try{
    await api.saveTx(d.id,rec);
    lastAcc=d.acc;
    if(!rec.date.startsWith(S.month))S.month=rec.date.slice(0,7);
    closeSheet();toast("Сохранено");render();
  }catch(e){toast("Не удалось сохранить: "+(e.message||e.code))}
}
async function delTx(){

}

      <button class="btn" data-act="save-acc">Сохранить</button></div>`);

async function saveAcc(){
  syncDraft();const d=draft;
  if(!d.name.trim())return toast("Введите название");
  const raw=parseFloat(String(d.amount||"0").replace(",","."))||0;
  const debt=TYPES[d.kind].debt;
  const rec={name:d.name.trim(),type:d.kind,initial:debt?-Math.abs(raw):raw};
  const n=v=>parseFloat(String(v).replace(",","."))||0;
  if(d.kind==="credit"&&n(d.limit))rec.limit=n(d.limit);
  if((d.kind==="credit"||d.kind==="loan")&&n(d.rate))rec.rate=n(d.rate);
  if(d.kind==="loan"&&n(d.payment))rec.payment=n(d.payment);
  try{await api.saveAcc(d.id,rec);closeSheet();toast("Сохранено")}
  catch(e){toast("Не удалось сохранить: "+(e.message||e.code))}
}
async function delAcc(){
  if(S.tx.some(t=>t.acc===draft.id||t.to===draft.id)){toast("У счёта есть операции. Сначала удалите или перенесите их");return}
  if(!draft.confirm){syncDraft();draft.confirm=true;return accSheet()}
  try{await api.del("accounts",draft.id);closeSheet();toast("Удалено")}catch(e){toast("Не удалось удалить")}
}
async function saveBud(){
  const limits={};

  const currency=$("#cur").value;

const CFG=window.APP_CONFIG||{};
const sb=(window.supabase&&CFG.key&&!CFG.key.startsWith("ВСТАВЬТЕ"))?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const mapAcc=r=>({id:r.id,name:r.name,type:r.type,initial:Number(r.initial),limit:r.credit_limit==null?undefined:Number(r.credit_limit),rate:r.rate==null?undefined:Number(r.rate),payment:r.payment==null?undefined:Number(r.payment)});
const mapTx=r=>({id:r.id,kind:r.kind,amount:Number(r.amount),date:r.date,cat:r.cat||"",acc:r.acc_id,to:r.to_id||"",note:r.note||"",by:r.by_user||""});
const ruErr=e=>{
  const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m))return "Неверная почта или пароль";
  if(/already registered/i.test(m))return "Такой аккаунт уже есть. Нажмите «Войти»";
  if(/Email not confirmed/i.test(m))return "Подтвердите почту по письму и войдите снова";
  if(/code_not_found/.test(m))return "Код не найден. Проверьте и введите ещё раз";
  if(/already_member/.test(m))return "Вы уже состоите в семье";
  if(/family_full/.test(m))return "В семье уже максимум участников";
  return m;
};
const api={
  async saveAcc(id,r){
    const row={household_id:hh,name:r.name,type:r.type,initial:r.initial,credit_limit:r.limit??null,rate:r.rate??null,payment:r.payment??null};
    if(id)row.id=id;
    const {error}=await sb.from("accounts").upsert(row);if(error)throw error;await loadAll();
  },
  async saveTx(id,r){
    const row={household_id:hh,kind:r.kind,amount:r.amount,date:r.date,cat:r.cat||null,acc_id:r.acc,to_id:r.to||null,note:r.note||"",by_user:r.by||S.uid};
    if(id)row.id=id;
    const {error}=await sb.from("transactions").upsert(row);if(error)throw error;await loadAll();
  },
  async del(table,id){const {error}=await sb.from(table).delete().eq("id",id);if(error)throw error;await loadAll()},
  async saveSettings(s){const {error}=await sb.from("households").update({settings:s}).eq("id",hh);if(error)throw error;await loadAll()}
};
async function fetchAll(table,col,asc){
  let out=[],from=0;
  for(;;){
    const {data,error}=await sb.from(table).select("*").order(col,{ascending:asc}).range(from,from+999);
    if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000;
  }
  return out;
}
async function loadAll(){
  try{
    const [a,t,h,m]=await Promise.all([
      fetchAll("accounts","name",true),fetchAll("transactions","date",false),
      sb.from("households").select("invite_code,settings").eq("id",hh).single(),
      sb.from("members").select("user_id,display_name")]);
    if(h.error)throw h.error;if(m.error)throw m.error;
    S.accounts=a.map(mapAcc);S.tx=t.map(mapTx);S.invite=h.data.invite_code;
    const st=h.data.settings||{};S.settings={currency:st.currency||"₽",limits:st.limits||{}};
    S.members=m.data;S.names={};m.data.forEach(x=>{if(x.display_name)S.names[x.user_id]=x.display_name});
    S.err=null;S.loaded=true;
  }catch(e){
    if(!S.loaded)S.err=ruErr(e);else toast("Нет связи, данные могут быть неактуальны");
  }
  const typing=S.tab==="bud"&&document.activeElement?.matches("input,select");
  if(!draft&&!typing)render();
}
let rt=null,tmr=null;
function subscribe(){
  if(rt)sb.removeChannel(rt);
  const bump=()=>{clearTimeout(tmr);tmr=setTimeout(loadAll,300)};
  rt=sb.channel("hh-"+hh);
  [["accounts",`household_id=eq.${hh}`],["transactions",`household_id=eq.${hh}`],["households",`id=eq.${hh}`],["members",`household_id=eq.${hh}`]]
    .forEach(([table,filter])=>rt.on("postgres_changes",{event:"*",schema:"public",table,filter},bump));
  rt.subscribe();
}
async function route(){
  if(!S.session){S.stage="auth";return render()}
  S.uid=S.session.user.id;
  const {data:m,error}=await sb.from("members").select("household_id").eq("user_id",S.uid).maybeSingle();
  if(error){S.stage="app";S.err=ruErr(error);return render()}
  if(!m){S.stage="house";return render()}
  hh=m.household_id;S.stage="app";S.loaded=false;render();
  await loadAll();subscribe();
}

  await sb.auth.signOut();
  if(rt){sb.removeChannel(rt);rt=null}
  Object.assign(S,{accounts:[],tx:[],members:[],session:null,uid:null,loaded:false,err:null,tab:"home"});hh=null;
  S.stage="auth";S.authMode="login";render();
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authform")return;
  e.preventDefault();
  const email=$("#au-email").value.trim(),password=$("#au-pass").value,reg=S.authMode==="reg";
  const r=reg?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return toast(ruErr(r.error));
  if(!r.data.session)return toast("Подтвердите почту по письму, затем войдите");
  S.session=r.data.session;route();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.stage==="app"&&hh)loadAll()});

async function start(){
  render();
  if(!sb){
    S.stage="app";S.err=window.supabase?"В файле config.js не указан ключ Supabase (anon key).":"Не загрузилась библиотека Supabase. Проверьте интернет.";
    return render();
  }
  const {data}=await sb.auth.getSession();
  S.session=data.session;
  await route();
}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
start();
</script>
</body>
</html>
